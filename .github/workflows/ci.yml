# CI gate. The branch rulesets require the aggregating check named `ci`.
# Every action is pinned to the commit SHA of its newest release (D-013); the
# tool versions below are kept in step with scripts/ci-local.sh.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  TRIVY_VERSION: v0.76.2
  GRYPE_VERSION: v0.121.3
  ACTIONLINT_VERSION: v1.7.12
  GOTOOLCHAIN: local

# An explicit shell makes every run step bash --noprofile --norc -eo pipefail:
# without it GitHub uses bash -e, and a step piped through tee takes tee's
# exit status (scripts/workflowcheck keeps this present in every workflow).
defaults:
  run:
    shell: bash

jobs:
  go:
    # Two pinned runner images, one per all-thread Landlock path: below ABI 8
    # go-landlock applies no_new_privs and landlock_restrict_self on every
    # thread through libcap/psx (the production path on Debian 13, ABI 6);
    # from ABI 8 it uses LANDLOCK_RESTRICT_SELF_TSYNC. ubuntu-24.04 runners
    # now report ABI 7 or ABI 8, so the psx entry runs its tests as the
    # landlock_forcepsx test build: the sandbox plans as at ABI 7 and applies
    # through psx on either kernel (internal/gate/sandbox/threadpath_forcepsx.go;
    # never released, scripts/release-binary-check.sh). The tsync entry also
    # runs the sandbox and gate tests under that tag, on its ABI 8 kernel.
    # Each entry requires its ABI, so the kernel-dependent tests fail rather
    # than skip, and asserts which path it took. The forced entry's name says
    # "effective ABI": its kernel reports a higher ABI (display name only; the
    # job id and the ci aggregate's needs are unchanged).
    # The main go test -race and the forced-psx step are this job; the
    # static checks, the test-only builds and the builds are go-checks, a
    # second required job on the same two runner images (P3, ARCHIVE §14).
    name: go test -race — ${{ matrix.image }}, ${{ matrix.tags && format('Landlock {0} forced, effective ABI {1}', matrix.path, matrix.abi) || format('Landlock ABI {0} ({1})', matrix.abi, matrix.path) }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            abi: "7"
            path: psx
            tags: landlock_forcepsx
          - image: ubuntu-26.04
            abi: "8"
            path: tsync
            tags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache key (setup-go hashes these files): the two go jobs of
          # a runner image build different things (P3, ARCHIVE §14).
          cache-dependency-path: |
            go.sum
      # The gate refuses fixtures whose parent directories are group/other-
      # writable, and the default /tmp is world-writable: give the tests a
      # private TMPDIR under $HOME.
      - name: private TMPDIR
        run: |
          d="$HOME/.shell-mcp-tmp"
          mkdir -p "$d" && chmod 0700 "$d"
          ls -ld / /home "$HOME" "$d"
          echo "TMPDIR=$d" >> "$GITHUB_ENV"
      # SHELL_MCP_REQUIRE_SECURE_TMP: tests fail (never skip) without a
      # trustworthy TMPDIR. SHELL_MCP_REQUIRE_LANDLOCK_ABI: each entry's
      # kernel ABI, so every sandbox test up to it (network rules from 4,
      # signal and abstract-socket scoping from 8) must run and fail rather
      # than skip. SHELL_MCP_EXPECT_LANDLOCK_PATH: the all-thread path this
      # entry must take (TestLandlockThreadPath, which reads it from a binary
      # built like the gate). TEST_TAGS: the entry's build tags; the tests
      # pass them on to the binaries they build (gatetest).
      - name: go test -race
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
          SHELL_MCP_REQUIRE_LANDLOCK_ABI: ${{ matrix.abi }}
          SHELL_MCP_EXPECT_LANDLOCK_PATH: ${{ matrix.path }}
          TEST_TAGS: ${{ matrix.tags }}
          # The runner's kernel supports MPTCP: the MPTCP tests' control case
          # (a socket opened without the filter) must succeed here, or fail.
          SHELL_MCP_REQUIRE_MPTCP: "1"
        run: |
          go test -race -timeout 20m -count=1 -v -tags "$TEST_TAGS" ./... 2>&1 | tee /tmp/go-test.log
          test "${PIPESTATUS[0]}" -eq 0
      # The forced-psx build on an ABI 8 kernel, every run: the psx entry's
      # runner may have ABI 7 or 8. Only an ABI 8 kernel shows that the forced
      # build requests nothing above ABI 7 (it would accept scoping silently)
      # and still enforces, so the step fails unless the kernel reported 8+.
      - name: go test -race (landlock_forcepsx on this ABI 8 kernel)
        if: matrix.tags == ''
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
          SHELL_MCP_REQUIRE_LANDLOCK_ABI: "7"
          SHELL_MCP_EXPECT_LANDLOCK_PATH: psx
          SHELL_MCP_REQUIRE_MPTCP: "1"
        run: |
          go test -race -timeout 20m -count=1 -v -tags landlock_forcepsx ./internal/gate/sandbox/ ./cmd/shell-mcp-gate/ 2>&1 | tee /tmp/go-test-forcepsx.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -E 'LANDLOCK_PATH=psx kernel_abi=([89]|[1-9][0-9]) effective_abi=7' /tmp/go-test-forcepsx.log ||
            { echo "the forced-psx build did not run on a kernel at Landlock ABI 8 or above" >&2; exit 1; }
      # Kernel-dependent tests, listed so that a skip is visible, with the
      # all-thread Landlock path this entry exercised.
      - name: sandbox tests that ran on this runner
        if: always()
        run: |
          {
            echo "### ${{ matrix.image }}: kernel $(uname -r)"
            echo "- build tags: ${{ matrix.tags || 'none (release build)' }}"
            echo "- Landlock path exercised: $(grep -o 'LANDLOCK_PATH=[a-z]* kernel_abi=[0-9]* effective_abi=[0-9]*' /tmp/go-test.log | head -n1) (expected ${{ matrix.path }}, ABI ${{ matrix.abi }})"
            echo '```'
            grep -E -- '--- (PASS|SKIP|FAIL): Test(Apply|AddPath|LandlockThreadPath|ThreadPathDecision|Integration(Sandbox|Swap|ExecLimits|GitPull|ServiceOps|SystemOps)|RequiredRefused|BestEffort)' /tmp/go-test.log || true
            echo '```'
            if [ -f /tmp/go-test-forcepsx.log ]; then
              echo "- landlock_forcepsx on this kernel: $(grep -o 'LANDLOCK_PATH=[a-z]* kernel_abi=[0-9]* effective_abi=[0-9]*' /tmp/go-test-forcepsx.log | head -n1) (expected psx, kernel ABI 8+, planned 7)"
              echo '```'
              grep -E -- '--- (PASS|SKIP|FAIL): Test(Apply|AddPath|LandlockThreadPath|ThreadPathDecision|IntegrationSandbox)' /tmp/go-test-forcepsx.log || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  go-checks:
    # gofmt, vet and lint (with and without the test-only tags), the
    # test-only builds' tests, the e2e runner-only guards, the diagnostic
    # build, govulncheck and the release cross-builds, on the same two runner
    # images as the go job (split from it for speed: P3, ARCHIVE §14).
    name: go checks (fmt, vet, lint, test-only builds, vuln, build) — ${{ matrix.image }}, ${{ matrix.tags && format('Landlock {0} forced, effective ABI {1}', matrix.path, matrix.abi) || format('Landlock ABI {0} ({1})', matrix.abi, matrix.path) }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            abi: "7"
            path: psx
            tags: landlock_forcepsx
          - image: ubuntu-26.04
            abi: "8"
            path: tsync
            tags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache key (setup-go hashes these files): the two go jobs of
          # a runner image build different things (P3, ARCHIVE §14).
          cache-dependency-path: |
            go.sum
            .golangci.yml
      # The gate refuses fixtures whose parent directories are group/other-
      # writable, and the default /tmp is world-writable: give the tests a
      # private TMPDIR under $HOME.
      - name: private TMPDIR
        run: |
          d="$HOME/.shell-mcp-tmp"
          mkdir -p "$d" && chmod 0700 "$d"
          ls -ld / /home "$HOME" "$d"
          echo "TMPDIR=$d" >> "$GITHUB_ENV"
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt: files need formatting:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          # Files built only with a tag: the e2e suite, the helper's e2e
          # bypass build, the server's elicitation diagnostic build, the
          # Landlock forced-psx test build, the gate's git-configuration
          # hook build and fsx's read-confinement hook build (none ever
          # released).
          go vet -tags e2e ./test/e2e/
          go vet -tags shellmcp_e2e_bypass ./internal/privd/... ./cmd/shell-mcp-privd/
          go vet -tags shellmcp_diag ./cmd/shell-mcp/ ./internal/tools/
          go vet -tags landlock_forcepsx ./...
          go vet -tags shellmcp_gitconfig_hook ./internal/gate/... ./cmd/shell-mcp-gate/
          go vet -tags shellmcp_confine_hook ./internal/gate/... ./internal/privd/... ./cmd/shell-mcp-gate/ ./cmd/shell-mcp-privd/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint (e2e, bypass, diagnostic, forced-psx, git-configuration and read-confinement hook build tags)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags=e2e,shellmcp_e2e_bypass,shellmcp_diag,landlock_forcepsx,shellmcp_gitconfig_hook,shellmcp_confine_hook
      # The end-to-end test build skips fsx's forbidden-root check, so these
      # tests prove the built-in read deny list refuses on its own.
      - name: go test -race (test build, fsx)
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
        run: go test -race -timeout 20m -count=1 -v -tags shellmcp_e2e_bypass ./internal/gate/fsx/
      # The gate's git-configuration hook build changes a repository's
      # configuration between the gate's check and its next git process, so
      # these tests prove git then runs nothing that configuration names
      # (handoff N-20). Never released (scripts/release-binary-check.sh).
      - name: go test -race (git-configuration hook build, gate ops)
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
        run: |
          git --version
          go test -race -timeout 20m -count=1 -v -tags shellmcp_gitconfig_hook -run 'TestGitConfigChangedAfterCheck|TestProductionOptionsHaveNoGitConfigHook' ./internal/gate/ops/
      # fsx's read-confinement hook build turns off one of the three layers
      # that keep a lookup in its root at a time, so these tests prove which
      # layer refuses a swapped path when another is gone (handoff N-12).
      # Never released (scripts/release-binary-check.sh).
      - name: go test -race (read-confinement hook build, fsx)
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
        run: go test -race -timeout 20m -count=1 -v -tags shellmcp_confine_hook -run 'TestConfineLayers' ./internal/gate/fsx/
      # The end-to-end entry points refuse to run anywhere but a GitHub-hosted
      # runner, before doing anything (each case runs under env -i, so this
      # runner's own variables do not leak in).
      - name: e2e runner-only guards
        run: |
          CGO_ENABLED=0 go test -c -trimpath -tags e2e -o "$RUNNER_TEMP/e2e.test" ./test/e2e
          E2E_TEST_BIN="$RUNNER_TEMP/e2e.test" bash test/e2e/guard_test.sh
      # The elicitation diagnostic build (shellmcp_diag): built and tested
      # here so the maintainer's local diagnostic works; never released.
      - name: go test -race (diagnostic build, server)
        env:
          SHELL_MCP_REQUIRE_SECURE_TMP: "1"
        run: |
          go test -race -timeout 20m -count=1 -v -tags shellmcp_diag ./cmd/shell-mcp/ ./internal/tools/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags shellmcp_diag -o /tmp/shell-mcp-diag.exe ./cmd/shell-mcp
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: cross-build (linux/amd64, linux/arm64)
        run: |
          for arch in amd64 arm64; do
            for c in shell-mcp shell-mcp-gate shell-mcp-privd; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "/tmp/$c-$arch" "./cmd/$c"
              # CGO_ENABLED=0 (psx then uses syscall.AllThreadsSyscall), and
              # none of the test-only builds (e2e bypass, diagnostic,
              # Landlock forced-psx).
              bash scripts/release-binary-check.sh "/tmp/$c-$arch"
              echo "built $c linux/$arch (CGO_ENABLED=0)"
            done
          done
      # README's quick start and CLIENTS §3.2: every subcommand and flag of a
      # shell-mcp, shell-mcp-gate or shell-mcp-privd command is in the --help
      # of the binary just built (scripts/doccheck/commands.go).
      - name: README and CLIENTS §3.2 commands against --help
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for c in shell-mcp shell-mcp-gate shell-mcp-privd; do cp "/tmp/$c-amd64" "$RUNNER_TEMP/bin/$c"; done
          go run ./scripts/doccheck -commands "$RUNNER_TEMP/bin"

  deps-current:
    name: deps-current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache of its own: this job builds little, and saving first under the
          # runner's key would leave the go job a near-empty cache (P4, ARCHIVE §14).
          cache: false
      - name: deps-current
        run: bash scripts/deps-current.sh
      - name: deps-current self-test
        run: bash scripts/deps-current_test.sh
      # The release check against release builds and each test-only build.
      - name: release-binary-check self-test
        run: bash scripts/release-binary-check_test.sh
      # The release scripts' refusals: tag and version formats, the CHANGELOG
      # section, the CI and CodeQL checks a release needs (offline).
      - name: release scripts self-test
        run: bash scripts/release/release_test.sh
      # verify-release.sh against fake cosign and gh that verify only what a
      # fixture signed: every tampered case and a dry run refused (offline).
      - name: verify-release self-test
        run: bash scripts/verify-release_test.sh
      # Every relative link, anchor and section reference in the live
      # documents resolves (handoff §4.H).
      - name: doc links and section references
        run: go run ./scripts/doccheck
      # The workflows themselves (G2): expressions, contexts, job and step
      # keys, runner labels (.github/actionlint.yaml). Built from its module at
      # the pinned version and verified by go.sum and the Go checksum database.
      # -shellcheck= turns off its shellcheck pass: the runner image's
      # unpinned shellcheck would otherwise run here and not in ci-local, whose
      # Go image has none. shellcheck comes as a pinned tool of its own in a
      # follow-up (ARCHIVE §14, 2026-11-03).
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -shellcheck=
      # The e2e-host shards: lists from the manifest, and the coverage check
      # refusing every incomplete, failed or overlapping set of results.
      - name: e2e shards self-test
        run: bash test/e2e/shards_test.sh
      # ci-local against a fake docker: it may label, list, stop and remove
      # only its own containers. No container is started here.
      - name: ci-local self-test
        run: bash scripts/ci-local_test.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No license key: this repository belongs to a personal account.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1

  image:
    name: image (build, Trivy, Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build (no push)
        run: docker build --build-arg VERSION=ci --build-arg REVISION="${GITHUB_SHA}" -t shell-mcp:ci .
      - name: image smoke test
        run: |
          docker run --rm shell-mcp:ci version
          test "$(docker image inspect shell-mcp:ci --format '{{.Config.User}}')" = "65532:65532"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache of its own: this job builds little, and saving first under the
          # runner's key would leave the go job a near-empty cache (P4, ARCHIVE §14).
          cache: false
      # The image's binary is a release build too: no test-only tag or code.
      - name: image binary is a release build
        run: |
          id="$(docker create shell-mcp:ci)"
          docker cp "$id:/shell-mcp" "$RUNNER_TEMP/shell-mcp-image"
          docker rm "$id" >/dev/null
          bash scripts/release-binary-check.sh "$RUNNER_TEMP/shell-mcp-image"
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: shell-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - name: Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: shell-mcp:ci
          grype-version: ${{ env.GRYPE_VERSION }}
          config: .grype.yaml
          fail-build: "true"
          severity-cutoff: high
          output-format: table

  probes:
    # Report-only: can this runner support Session 1's Landlock tests and
    # Session 1c's systemd-container e2e? Not in the `ci` job's needs, marked
    # continue-on-error, and every command is `|| true`, so it never fails a
    # required check. The helper e2e approach is decided in S1c.
    name: probes (Landlock, systemd container)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache of its own: this job builds little, and saving first under the
          # runner's key would leave the go job a near-empty cache (P4, ARCHIVE §14).
          cache: false
      - name: probe
        run: |
          {
            echo "### Runner probes"
            echo "- kernel: $(uname -r)"
            echo "- runner: $( { go build -o /tmp/landlock-probe ./scripts/probe/landlock && /tmp/landlock-probe; } 2>&1 | tail -n1 || true)"
            echo "- golang container: $(docker run --rm -v "$PWD:/src:ro" -w /src -e GOFLAGS=-buildvcs=false -e HOME=/tmp -u 65532:65532 \
                "$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i ~ /^golang:/) { print $i; exit } }' Dockerfile)" \
                sh -c 'GOCACHE=/tmp/c GOMODCACHE=/tmp/m go run ./scripts/probe/landlock' 2>&1 | tail -n1 || true)"
            echo "- systemd probe:"
            echo '```'
            bash scripts/probe/systemd.sh 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  e2e-host:
    # End-to-end tests of the gate and the privileged helper against the
    # runner VM's own systemd, journald and polkit (the runner's Docker
    # cannot boot a systemd container: S0 probes). This is the only job that
    # uses sudo (CLAUDE.md exception): a GitHub-hosted runner, no secrets,
    # read-only token, pull_request and push only. It creates invented test
    # accounts and installs units on a VM that is discarded afterwards.
    # Sharded (P1, ARCHIVE §14): each shard is a runner VM of its own with the
    # full setup and runs its share of the e2e binary's tests
    # (test/e2e/shards.txt); e2e-host-coverage checks that together they ran
    # every test once and that each passed. Both are in ci's needs, so a
    # failed, cancelled or skipped shard, or a coverage mismatch, fails ci.
    name: e2e-host shard ${{ matrix.shard }} (systemd, journald, polkit on the runner VM)
    runs-on: ubuntu-26.04
    # About 2.3 times a shard's expected 8 to 9 minutes (P5, ARCHIVE §14).
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One more than the highest shard test/e2e/shards.txt names: the
        # shard's tests step fails if the two disagree.
        shard: [1, 2, 3, 4]
    env:
      # The core unit's score on this image: the job fails if systemd-analyze
      # security rates it worse (ARCHIVE §14: S1c 1.6, S1d 1.4, S6-5 1.3 with
      # ProtectHome=yes, as the offline check in the exposure job predicts). The
      # broad unit's score is recorded, not enforced (root-equivalent by design).
      E2E_SECURITY_MAX: "1.3"
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache key (setup-go hashes these files), apart from the go
          # jobs' on the same runner image (P3, P4: ARCHIVE §14).
          cache-dependency-path: |
            go.sum
            test/e2e/setup.sh
      - name: build the binaries and the e2e suite (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: |
          out="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$out"
          go build -trimpath -o "$out/shell-mcp" ./cmd/shell-mcp
          go build -trimpath -o "$out/shell-mcp-gate" ./cmd/shell-mcp-gate
          go build -trimpath -o "$out/shell-mcp-privd" ./cmd/shell-mcp-privd
          go build -trimpath -tags shellmcp_e2e_bypass -o "$out/shell-mcp-privd-bypass" ./cmd/shell-mcp-privd
          go build -trimpath -ldflags "-X main.outside=/etc/example-other/secret.txt" -o "$out/example-probe" ./internal/gate/gatetest/testdata/probe
          go test -c -trimpath -tags e2e -o "$out/e2e.test" ./test/e2e
          chmod 0755 "$out"/*
      - name: build the server image (init's bind form from a host directory)
        # The image the e2e test runs shell-mcp init and init compose in, and
        # starts with docker compose: labelled, built from this commit's
        # Dockerfile. No sudo.
        run: docker build --label shell-mcp.e2e=init -t shell-mcp-e2e:server .
      - name: runner facts
        run: |
          {
            echo "### e2e-host runner"
            echo "- shard $SHARD of $SHARDS"
            echo "- image: ubuntu-26.04, kernel $(uname -r)"
            echo "- $(systemctl --version | head -n1)"
            echo "- landlock: $(go run ./scripts/probe/landlock 2>&1 | tail -n1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: install polkitd, openssh-server and jq (if the image lacks them)
        run: |
          missing=""
          test -x /usr/lib/polkit-1/polkitd || missing="$missing polkitd"
          test -x /usr/sbin/sshd || missing="$missing openssh-server"
          test -x /usr/bin/jq || missing="$missing jq"
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086 # one package per word
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $missing
          fi
          echo "- polkit: $(dpkg-query -W -f='${Package} ${Version}' polkitd)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- OpenSSH (server tests): $(/usr/sbin/sshd -V 2>&1 | head -n1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- jq (memory tests): $(/usr/bin/jq --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: setup (as root)
        run: |
          sudo install -d -o root -g root -m 0755 /opt/e2e-bin
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP"/e2e-bin/* /opt/e2e-bin/
          # sudo resets the environment: pass the runner's own GITHUB_ACTIONS
          # and RUNNER_ENVIRONMENT through, for the runner-only guards of
          # setup.sh and the e2e test binary.
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" E2E_BIN=/opt/e2e-bin E2E_LANDLOCK=required bash test/e2e/setup.sh
      - name: the shard's tests
        run: |
          n="$(bash test/e2e/shards.sh count test/e2e/shards.txt)"
          test "$SHARDS" = "$n" || { echo "the matrix has $SHARDS shards, test/e2e/shards.txt $n" >&2; exit 1; }
          out="$RUNNER_TEMP/e2e-shard"
          mkdir -p "$out"
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /opt/e2e-bin/e2e.test -test.list '.*' >"$out/raw-list"
          grep '^Test' "$out/raw-list" >"$out/all-tests"
          bash test/e2e/shards.sh list test/e2e/shards.txt "$out/all-tests" "$SHARD" >"$out/list"
          test -s "$out/list" || { echo "shard $SHARD runs no test" >&2; exit 1; }
          echo "shard $SHARD of $n: $(wc -l <"$out/list") of the binary's $(wc -l <"$out/all-tests") tests"
          cat "$out/list"
      - name: e2e tests (as root; nothing may skip)
        run: |
          run="$(bash test/e2e/shards.sh regex "$RUNNER_TEMP/e2e-shard/list")"
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            E2E_BIN=/opt/e2e-bin E2E_REQUIRE_ALL=1 E2E_SECURITY_MAX="$E2E_SECURITY_MAX" E2E_SERVER_IMAGE=shell-mcp-e2e:server \
            /opt/e2e-bin/e2e.test -test.v -test.count=1 -test.run "$run" 2>&1 | tee "$RUNNER_TEMP/e2e-shard/log"
      # execx's credential option needs a root test process (handoff §4.A,
      # TARGET-SETUP §12.1 step 4); with SHELL_MCP_REQUIRE_ROOT_TESTS=1 a skip
      # is a failure, and each test must be listed as passed. In the last
      # shard; e2e-host-coverage checks that its log is there.
      - name: execx credential tests (as root; nothing may skip)
        if: matrix.shard == strategy.job-total
        run: |
          log="$RUNNER_TEMP/e2e-shard/credential.log"
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" PATH="$PATH" HOME=/root TMPDIR=/tmp \
            GOCACHE="$RUNNER_TEMP/root-gocache" GOMODCACHE="$(go env GOMODCACHE)" GOFLAGS=-mod=readonly GOPROXY=off GOTOOLCHAIN=local \
            SHELL_MCP_REQUIRE_ROOT_TESTS=1 go test -count=1 -v -run 'Credential|NilCredential' ./internal/gate/execx/ 2>&1 | tee "$log"
          for t in TestCredentialSwitch TestCredentialNoGroups TestCredentialNPROC TestCredentialRefusedValuesAsRoot TestNilCredentialAsRoot TestCredentialCallSites; do
            grep -q -- "^--- PASS: $t " "$log" || { echo "$t did not pass as root" >&2; exit 1; }
          done
          # The non-root refusal test is the one that skips as root (it runs in every non-root go test).
          if grep -E -- '--- (SKIP|FAIL)' "$log" | grep -v -- '--- SKIP: TestCredentialRefusedWhenNotRoot '; then exit 1; fi
      - name: summary (every test of the shard must have run and passed)
        if: always()
        run: |
          d="$RUNNER_TEMP/e2e-shard"
          table="$RUNNER_TEMP/e2e-summary.md"
          mkdir -p "$d"
          touch "$d/log" "$d/list"
          # An empty list (a refused or broken binary) must fail, not pass.
          test -s "$d/list" || { echo "no e2e tests listed for shard $SHARD" >&2; exit 1; }
          fail=0
          {
            echo "### e2e-host shard $SHARD of $SHARDS"
            echo "| test | result |"
            echo "|---|---|"
          } >"$table"
          while read -r t; do
            # One awk, no pipeline: no result line is "NOT RUN", not an early exit.
            r="$(awk -v t="$t" '$1 == "---" && $3 == t { sub(/:$/, "", $2); print $2; exit }' "$d/log")"
            [ -n "$r" ] || r="NOT RUN"
            [ "$r" = PASS ] || fail=1
            echo "| $t | $r |" >>"$table"
          done <"$d/list"
          grep -o 'E2E_EXPOSURE=[0-9.]*' "$d/log" | sed 's/^E2E_EXPOSURE=/- systemd-analyze security exposure (core unit): /' >>"$table" || true
          grep -o 'E2E_EXPOSURE_BROAD=[0-9.]*' "$d/log" | sed 's/^E2E_EXPOSURE_BROAD=/- systemd-analyze security exposure (broad unit, root-equivalent by design, information only): /' >>"$table" || true
          echo "- threshold (E2E_SECURITY_MAX): $E2E_SECURITY_MAX" >>"$table"
          tee -a "$GITHUB_STEP_SUMMARY" <"$table"
          if grep -qE -- '--- (SKIP|FAIL)' "$d/log"; then fail=1; fi
          exit "$fail"
      # The shard's test lists, its log and (last shard) the credential log,
      # for e2e-host-coverage: test names and test output, as in this job's log.
      - name: upload the shard's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-shard/
          if-no-files-found: error
          retention-days: 7
      - name: journal (on failure)
        if: failure()
        run: |
          sudo journalctl --no-pager -n 100 -t shell-mcp-privd -t shell-mcp-gate || true
          sudo journalctl --no-pager -n 60 -u 'shell-mcp-privd@*' -u polkit.service || true
          systemctl --failed --no-pager || true

  e2e-host-coverage:
    # Every e2e test ran in exactly one e2e-host shard and passed, and the
    # last shard's credential tests passed (test/e2e/shards.sh cover). Runs
    # whatever the shards' results, and fails unless every shard succeeded.
    name: e2e-host coverage (every e2e test in one shard, all passed)
    needs: e2e-host
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          path: shards
      - name: every test in one shard, each passed
        if: always()
        run: bash test/e2e/shards.sh cover test/e2e/shards.txt shards | tee -a "$GITHUB_STEP_SUMMARY"
      - name: every shard succeeded
        if: always()
        env:
          RESULT: ${{ needs.e2e-host.result }}
        run: |
          test "$RESULT" = success || { echo "e2e-host shards: $RESULT" >&2; exit 1; }

  exposure:
    # The offline exposure check (handoff N-28): the helper's generated core
    # units, for the example policy and every end-to-end policy, rated by
    # systemd-analyze security --offline in the systemd of Debian 13 (257),
    # Ubuntu 24.04 (255) and Ubuntu 26.04 (259), against the scores recorded in
    # scripts/exposure/scores.txt. Unprivileged containers, no host mounts but
    # the checkout (read-only) and the Go cache volume, no sudo.
    name: exposure (offline, systemd 255, 257, 259)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rate the core units offline
        run: bash scripts/exposure/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # The check's negative control: the same units with ProtectHome=yes
      # undone must be refused.
      - name: a weakened unit is refused
        run: |
          if EXPOSURE_WEAKEN='e2e:s/^ProtectHome=yes$/ProtectHome=read-only/' bash scripts/exposure/run.sh > "$RUNNER_TEMP/weakened.out" 2>&1; then
            cat "$RUNNER_TEMP/weakened.out"
            echo "a weakened unit passed the exposure check"
            exit 1
          fi
          grep -h FAIL "$RUNNER_TEMP/weakened.out"

  setup-check:
    # The setup check (handoff §3.8, F-13): shell-mcp-gate install,
    # host-key and shell-mcp-privd install --no-start on Debian 13, Ubuntu
    # 24.04 and Ubuntu 26.04 containers, each run as its own root (approved,
    # handoff §7 Q2) but unprivileged: Docker's default capabilities with
    # none added, no-new-privileges, no host mount but the checkout
    # (read-only) and the Go cache volume. The SSH round trip runs between
    # two of them on a labelled network; execx's credential tests run as the
    # Go image's root. Then shell-mcp init runs in the server image built from
    # this commit (65532, no network, read-only, no capabilities) into a
    # labelled volume, and the server starts from init compose's printed file
    # in both forms and passes shell-mcp check against a target. No sudo.
    name: setup-check (Debian 13, Ubuntu 24.04, Ubuntu 26.04 containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install, refusals, SSH round trip, privd install, init
        run: bash scripts/setup-check/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

  caddy-check:
    # deploy/caddy/Caddyfile, an example (handoff §4.G): its upstreams and the
    # README's addresses against deploy/docker-compose.yml, the decided shape,
    # and caddy validate in a test-only image pinned by digest
    # (scripts/caddy-check/Dockerfile): no network, a read-only root, no
    # capabilities, non-root. deploy/caddy/nginx.conf the same way, with nginx -t
    # (scripts/nginx-check/). No proxy runs here. No sudo.
    name: caddy-check (deploy/caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: drift, shape and caddy validate
        run: bash scripts/caddy-check/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: nginx.conf drift, shape and nginx -t
        run: bash scripts/nginx-check/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

  proxy-live-check:
    # deploy/caddy/Caddyfile and nginx.conf live, each in its static check's
    # test-only image, in front of the server image built from this commit
    # and started from init compose's printed file; clients on a separate
    # internal network that reaches only the proxy. The token, the client
    # address the server logs (forged X-Forwarded-For included), the
    # approval page's Host rule, the allowed ranges and doctor's rows, with
    # negative controls (scripts/proxy-live-check/run.sh). Containers are
    # non-root where they can be, with no capabilities added, no host mount
    # and every one labelled. No sudo.
    name: proxy-live-check (Caddy and nginx in front of the server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the example proxies, live
        run: bash scripts/proxy-live-check/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    if: always()
    needs: [go, go-checks, deps-current, gitleaks, image, e2e-host, e2e-host-coverage, exposure, setup-check, caddy-check, proxy-live-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if a required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "required job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: report
        run: |
          echo "required job results: ${{ join(needs.*.result, ', ') }}"
