# CodeQL advanced setup (GitHub's default setup is deliberately off; the two
# cannot run together). Actions pinned to release SHAs (D-013).
# Two languages: Go (built manually) and the workflows themselves (actions,
# no build: injection and permission findings in .github/workflows, among
# them the release workflows).
name: codeql

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# An explicit shell makes every run step bash --noprofile --norc -eo pipefail:
# without it GitHub uses bash -e, and a step piped through tee takes tee's
# exit status (scripts/workflowcheck keeps this present in every workflow).
defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          # No cache: saving first under the runner's key would leave ci's go
          # job a near-empty cache. What CodeQL analyses is unchanged.
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: build
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
