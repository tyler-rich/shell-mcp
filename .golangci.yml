# golangci-lint v2 configuration. No exclusions except generated code; a
# finding is fixed, or suppressed inline with a specific linter and a reason
# (nolintlint enforces both). Never disable a gosec rule to pass: bring the
# finding to the maintainer.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    generated: strict
    presets: []
    rules: []

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tyler-rich/shell-mcp
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
