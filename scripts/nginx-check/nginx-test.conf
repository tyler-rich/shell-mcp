# Test-only main configuration for scripts/nginx-check/run.sh: what a
# deployer's own nginx.conf provides around deploy/caddy/nginx.conf, reduced
# to what `nginx -t` needs as a non-root user on a read-only root with /tmp
# as its only writable directory. Not an example to deploy.
pid /tmp/nginx.pid;
error_log stderr;
events {}
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /etc/nginx/conf.d/*.conf;
}
