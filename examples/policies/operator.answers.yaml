# Example gate policy: operator (reversible changes).
#
# Placeholders only. Install as root at /etc/shell-mcp/operator.yaml
# (root:root 0644) for a separate SSH key; the server using that key runs
# with SHELL_MCP_PROFILE=operator. Grant the service account write access to
# the write roots with ACLs (setfacl), and install the polkit rule from
#   shell-mcp-gate polkit --policy /etc/shell-mcp/operator.yaml --user svc-shell
# as /etc/polkit-1/rules.d/60-shell-mcp.rules. There is no sudo anywhere.

# Answers for `shell-mcp-gate policy new` (docs/POLICY.md §9). With these
# answers it writes examples/policies/operator.yaml byte for byte. Every
# value is a placeholder. The opening comment above becomes the top of the
# policy's header; this one is not carried.
preset: operator
account: { user: svc-shell, uid: 60123 }
read: [/srv/app, /etc/example-app, /var/log/example-app]
write: [/srv/app/config, /srv/app/deploy]
deny: ["/srv/app/secrets/**", "**/*.key"]
services:
  status: ["example-*.service"]
  control:
    units: ["example-app.service"]
    verbs: [restart, reload]
journal:
  units: ["example-*.service"]
git:
  repos:
    - path: /srv/app/deploy
      remote: https://git.example.test/org/deploy.git
commands:
  - id: apt-upgradable
    path: /usr/bin/apt
    tier: read
    description: "Packages with available upgrades"
    templates:
      - ["list", "--upgradable"]
  # {path:read} is resolved under a read root and checked against the
  # deny list; the resolved path is what findmnt receives. (On Ubuntu
  # 26.04, coreutils commands such as du resolve to the uutils multi-call
  # binary and are judged as the utility they run as; check-policy says
  # so. POLICY §5.)
  - id: app-filesystem
    path: /usr/bin/findmnt
    tier: read
    description: "Filesystem and free space holding an application directory"
    templates:
      - ["--noheadings", "--output", "SOURCE,FSTYPE,SIZE,USED,AVAIL", "--target", "{path:read}"]
