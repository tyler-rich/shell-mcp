# An example nginx configuration for shell-mcp: one way to meet the
# properties every reverse proxy in front of it needs (README.md here).
# Placeholders only: mcp.example.test and approve.example.test, a LAN
# 192.0.2.0/24 and a VPN 198.51.100.0/24 (documentation ranges: put your
# own), the certificate paths, and the server at 172.30.80.10 on the `front`
# network of deploy/docker-compose.yml.
#
# nginx runs as a container on `front` at the fixed address 172.30.80.5, the
# only entry in SHELL_MCP_TRUSTED_PROXIES. An nginx installed on the host
# (from the distribution's packages) is not supported by this layout: it
# reaches the server from the network's gateway, and the gateway must never
# be trusted (README.md, property 1).
#
# This file holds server blocks for nginx's http context: put it where your
# nginx.conf includes them (the official image includes
# /etc/nginx/conf.d/*.conf), and mount that directory, not this file alone,
# so that `nginx -s reload` sees an edit (property 5).

# The MCP endpoint (the server's SHELL_MCP_PORT, 8080), from the LAN and the
# VPN only. Everything else gets 403.
server {
    listen 443 ssl;
    server_name mcp.example.test;

    # TLS is your choice: a certificate for this name from your own CA or a
    # public one, or terminate TLS in front of nginx, or run over a VPN.
    ssl_certificate     /etc/nginx/tls/mcp.example.test.crt;
    ssl_certificate_key /etc/nginx/tls/mcp.example.test.key;

    # Explicit LAN and VPN ranges only. Never a range that holds a Docker
    # network (172.16.0.0/12 holds Docker's default bridge networks), never
    # every private range: a tunnel's connector (Cloudflare Tunnel, ngrok,
    # Tailscale Funnel, …) in a container on such a network would pass, and
    # the internet with it. Never put this server behind a tunnel or an
    # internet-facing relay at all (README.md, property 4).
    allow 192.0.2.0/24;
    allow 198.51.100.0/24;
    deny all;

    # The request body bound (the server reads at most 1 MiB).
    client_max_body_size 2m;

    location / {
        proxy_pass http://172.30.80.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The name the client used: the server answers only for the names in
        # SHELL_MCP_ALLOWED_HOSTS; nginx would send 172.30.80.10:8080.
        proxy_set_header Host $host;
        # Replace what a client sent with the address nginx saw: the server
        # believes only the last entry, and only from 172.30.80.5.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Streamable HTTP answers can be event streams: pass them on as they
        # come, and wait at least SHELL_MCP_MAX_TIMEOUT (default 300 s) for a
        # tool call. Raise it with that variable.
        proxy_buffering off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}

# The approval page (the server's SHELL_MCP_APPROVAL_PORT, 8081), from the
# LAN and the VPN only, never from the internet. Everything else gets 403.
server {
    listen 443 ssl;
    server_name approve.example.test;

    ssl_certificate     /etc/nginx/tls/approve.example.test.crt;
    ssl_certificate_key /etc/nginx/tls/approve.example.test.key;

    # The same explicit ranges, and the same rule: no Docker network, no
    # tunnel or relay in front of this page.
    allow 192.0.2.0/24;
    allow 198.51.100.0/24;
    deny all;

    client_max_body_size 2m;

    location / {
        proxy_pass http://172.30.80.10:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The page answers only for SHELL_MCP_APPROVAL_PUBLIC_URL's host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
